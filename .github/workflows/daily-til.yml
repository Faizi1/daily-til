name: Daily TIL

on:
  schedule:
    # 12:00 UTC = 5:00 PM Pakistan time (PKT, UTC+5). Adjust as you like.
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  add-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily TIL script
        run: python scripts/daily_til.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TIL.md data/state.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "docs: daily TIL entry $(date -u +'%Y-%m-%d')"
          git push
